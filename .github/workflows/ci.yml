name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  driver-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driveapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: driveapp/package-lock.json
      - name: Install
        run: npm ci
      - name: Forbid service_role in source
        run: npm run check:security
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
